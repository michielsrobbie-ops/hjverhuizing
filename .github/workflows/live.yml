# Zet bij elke push naar main de inhoud van site/ op de branch "live".
# Hostinger (hPanel > Geavanceerd > Git) deployt die branch naar public_html.
name: Publiceer naar live-branch
on:
  push:
    branches: [main]
    paths: ["site/**", ".github/workflows/live.yml"]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: site/ naar branch live
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git subtree split --prefix site -b live-tmp
          git push -f origin live-tmp:live
